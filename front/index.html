<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CryptoTaro — Дашборд</title>

  <link rel="stylesheet" href="assets/app.css"/>
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div id="app"></div>

<script src="assets/i18n.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/api.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>

<script>
if (!AUTH.requireAuth()) {
}

mountLayout({
  pageTitle: "Дашборд",
  pageSubtitle: "Live-ціни, графік та швидкий аналіз"
});
AUTH.syncProfilePill();

const page = document.getElementById("page");

page.innerHTML = `
  <div class="grid">

    <div class="card col-12">
      <div class="row" style="justify-content:space-between; align-items:flex-end">
        <div class="row" style="gap:12px">
          <div>
            <label>Символ</label>
            <input id="symbol" class="input" value="BTC"/>
          </div>
          <div>
            <label>Тип графіка</label>
            <select id="chartType" class="input">
              <option value="candles">Свічки</option>
              <option value="line">Лінія</option>
            </select>
          </div>
        </div>

        <div class="row">
          <button class="btn primary" id="loadBtn">Завантажити</button>
          <button class="btn" id="pinBtn">📌 Закріпити</button>
        </div>
      </div>
    </div>

    <div class="card col-3">
      <h3>Ціна</h3>
      <div class="kpi" id="price">—</div>
    </div>

    <div class="card col-3">
      <h3>Зміна 24г</h3>
      <div class="kpi" id="change24">—</div>
    </div>

    <div class="card col-3">
      <h3>Обсяг 24г</h3>
      <div class="kpi" id="volume">—</div>
    </div>

    <div class="card col-3">
      <h3>Market Cap</h3>
      <div class="kpi" id="cap">—</div>
    </div>

    <div class="card col-12" style="padding:0">
      <div id="chart" style="height:420px"></div>
    </div>

  </div>
`;

const chart = LightweightCharts.createChart(
  document.getElementById("chart"),
  {
    layout: { background: { color: "transparent" }, textColor: "#e8eefc" },
    grid: {
      vertLines: { color: "rgba(255,255,255,.06)" },
      horzLines: { color: "rgba(255,255,255,.06)" }
    }
  }
);

let series = chart.addCandlestickSeries({
  upColor: "#22c55e",
  downColor: "#ef4444",
  borderUpColor: "#22c55e",
  borderDownColor: "#ef4444",
  wickUpColor: "#22c55e",
  wickDownColor: "#ef4444"
});

async function loadData() {
  const symbol = document.getElementById("symbol").value.trim().toUpperCase();
  const type = document.getElementById("chartType").value;

  try {
    const quote = await API.getQuote(symbol);

    document.getElementById("price").textContent =
      UI.formatMoney(quote.price);
    document.getElementById("change24").textContent =
      UI.formatPct(quote.percent_change_24h);
    document.getElementById("volume").textContent =
      UI.formatMoney(quote.volume_24h);
    document.getElementById("cap").textContent =
      UI.formatMoney(quote.market_cap);

    const history = await API.getHistory(symbol, 100);

    chart.removeSeries(series);
    series = (type === "line")
      ? chart.addLineSeries()
      : chart.addCandlestickSeries({
          upColor: "#22c55e",
          downColor: "#ef4444",
          borderUpColor: "#22c55e",
          borderDownColor: "#ef4444",
          wickUpColor: "#22c55e",
          wickDownColor: "#ef4444"
        });

    const data = history.map(h => {
      const t = Math.floor(new Date(h.timestamp).getTime() / 1000);
      return type === "line"
        ? { time: t, value: h.price }
        : {
            time: t,
            open: h.open_price,
            high: h.high_price,
            low: h.low_price,
            close: h.close_price
          };
    });

    series.setData(data);
    chart.timeScale().fitContent();

    UI.toast("CryptoTaro", `${symbol} оновлено`);
  } catch (e) {
    UI.toast("Помилка", e.message);
  }
}

document.getElementById("loadBtn").onclick = loadData;
document.getElementById("pinBtn").onclick = async () => {
  const s = document.getElementById("symbol").value.trim().toUpperCase();
  await API.pinDashboardSymbol(s);
  UI.toast("CryptoTaro", `${s} закріплено`);
};

loadData();
</script>

</body>
</html>
