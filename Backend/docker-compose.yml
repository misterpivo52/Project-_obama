version: "3.9"

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - bot

  worker:
    build: .
    command: celery -A crypto worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A crypto beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  bot:
    build: .
    command: python bot/bot.py
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "5055:5055"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
